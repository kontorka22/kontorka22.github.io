<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Поток">
<title>Поток РФ → ОАЭ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css?v=14">
</head>
<body>
<header class="top">
  <h1 id="title">День</h1>
  <button id="sync" class="sync" type="button"><span class="dot"></span><span id="syncText">не подключено</span></button>
</header>

<main>
  <!-- ДЕНЬ -->
  <section id="tab-day" class="tab active">
    <div class="datebar">
      <button type="button" class="nav" id="dPrev" aria-label="Предыдущий день">‹</button>
      <label class="dlabel"><span id="dLabel"></span><input id="date" type="date"></label>
      <button type="button" class="nav" id="dNext" aria-label="Следующий день">›</button>
    </div>

    <button type="button" id="cbCard" class="card cbcard">
      <span class="cbtitle">Курс ЦБ, ₽ за 1 USD</span>
      <span class="cbbig" id="cbValue">—</span>
      <span class="cbnote" id="cbNote"></span>
    </button>

    <div class="card quote">
      <div class="qhead">
        <span class="muted small" id="qLabel">Клиент платит, ₽</span>
        <button type="button" id="qSwap" class="swap">₽ ⇄ USDT</button>
      </div>
      <div class="qinput"><input id="qIn" inputmode="decimal" placeholder="0" autocomplete="off"><span id="qCur">₽</span></div>
      <div class="qout" id="qOut"></div>
      <div class="muted small" id="qRate"></div>
      <div id="oooPick" class="seg"></div>
      <button type="button" id="qAdd" class="btn" disabled>+ В поток дня</button>
    </div>

    <div class="card">
      <div class="muted small">Поток за день</div>
      <div class="flowbig" id="sFlow">0 ₽</div>
      <div class="muted small" id="sOps"></div>
      <div class="three">
        <div class="cell"><span class="lab">Себес</span><b class="cost" id="sCostSum">—</b><span class="rate" id="sCostRate"></span></div>
        <div class="cell"><span class="lab">Продажа клиентам</span><b class="sale" id="sSaleSum">—</b><span class="rate" id="sSaleRate"></span></div>
        <div class="cell diff"><span class="lab">Разница</span><b id="sDiffSum">—</b><span class="rate" id="sDiffRate"></span></div>
      </div>
    </div>

    <div id="ops"></div>
  </section>

  <!-- ОТЧЁТ -->
  <section id="tab-rep" class="tab">
    <div class="seg big" id="repKind">
      <button type="button" data-k="day">День</button>
      <button type="button" data-k="month" class="on">Месяц</button>
      <button type="button" data-k="year">Год</button>
    </div>
    <div class="datebar">
      <button type="button" class="nav" id="rPrev">‹</button>
      <div class="dlabel" id="rLabel"></div>
      <button type="button" class="nav" id="rNext">›</button>
    </div>
    <div id="repBody"></div>
  </section>

  <!-- ПЛАН -->
  <section id="tab-plan" class="tab">
    <div class="datebar">
      <button type="button" class="nav" id="plPrev">‹</button>
      <div class="dlabel" id="plLabel"></div>
      <button type="button" class="nav" id="plNext">›</button>
    </div>
    <div class="card" id="planIn"></div>
    <div id="planOut"></div>
  </section>

  <!-- СЕБЕСТОИМОСТЬ -->
  <section id="tab-cost" class="tab">
    <div class="card preview"><span class="muted small">Себестоимость сегодня</span><b class="cost" id="costPreview">—</b><span class="muted small" id="costPreviewNote"></span></div>
    <div id="costBody"></div>
  </section>

  <!-- ПРОДАЖА -->
  <section id="tab-sale" class="tab">
    <div class="card preview"><span class="muted small">Курс продажи сегодня</span><b class="sale" id="salePreview">—</b><span class="muted small" id="salePreviewNote"></span></div>
    <div id="saleBody"></div>
  </section>
</main>

<!-- вход в общий журнал -->
<dialog id="syncDlg">
  <div class="dlghead"><h3>Общий журнал</h3><button type="button" class="x" id="syncClose">×</button></div>
  <label class="lbl">Ваше имя — им подписываются изменения<input id="meName" type="text" inputmode="text" autocapitalize="words" autocomplete="off"></label>
  <div id="syncLogged" class="hidden">
    <p class="muted small">Вход: <b id="syncEmail"></b></p>
    <div class="askbtns">
      <button type="button" id="syncNowBtn" class="btn sec">Синхронизировать</button>
      <button type="button" id="logoutBtn" class="btn sec">Выйти</button>
    </div>
  </div>
  <form id="loginForm">
    <p class="muted small" id="loginNote"></p>
    <div id="cfgFields">
      <label class="lbl">Адрес базы (Supabase URL)<input name="url" placeholder="https://xxxx.supabase.co" autocomplete="off"></label>
      <label class="lbl">Ключ (anon key)<input name="key" autocomplete="off"></label>
    </div>
    <label class="lbl">Почта<input name="email" type="email" autocomplete="username"></label>
    <label class="lbl">Пароль<input name="password" type="password" autocomplete="current-password"></label>
    <button class="btn sec">Войти</button>
    <div id="loginErr" class="err small"></div>
  </form>
  <h3 class="histhead">История изменений</h3>
  <div id="history"></div>
</dialog>

<!-- подтверждение / ввод значения -->
<dialog id="askDlg" class="ask">
  <p id="askText"></p>
  <input id="askInput" class="hidden" inputmode="decimal" autocomplete="off">
  <div class="askbtns">
    <button type="button" id="askCancel" class="btn sec">Отмена</button>
    <button type="button" id="askOk" class="btn">OK</button>
  </div>
</dialog>

<nav class="tabs">
  <button type="button" data-tab="day" class="active"><i>◉</i>День</button>
  <button type="button" data-tab="rep"><i>▤</i>Отчёт</button>
  <button type="button" data-tab="plan"><i>◎</i>План</button>
  <button type="button" data-tab="cost"><i>↓</i>Себестоимость</button>
  <button type="button" data-tab="sale"><i>↑</i>Продажа</button>
</nav>

<script type="module" src="app.js?v=20"></script>
</body>
</html>
